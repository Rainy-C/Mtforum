name: Android Release

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore preview signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mtforum-preview-signing-v1-${{ github.repository_id }}
      - name: Lint and assemble release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MtForum-0.3.0-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.*
          if-no-files-found: ignore
